name: I27 historical ledger and current I32 clearance
# I32 replaces the historical auto-authoring/publication recipe with read-only current-source verification.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/i27-final-clearance.yml'
      - 'docs/engineering/rvb22/analyses/i32/**'
      - 'docs/engineering/rvb22/candidate/**'
      - 'docs/engineering/rvb22/current/i32_manufacturing/**'
      - 'docs/engineering/rvb22/product/**'
permissions:
  contents: read
jobs:
  finalize:
    if: github.event.pull_request.number == 46 && github.head_ref == 'codex/rvb24-coordinated-closure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - name: Provision pinned I32 analysis dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/i32-clearance-env"
          "$RUNNER_TEMP/i32-clearance-env/bin/pip" install -r docs/engineering/rvb22/analyses/i32/procurement_redline/requirements.txt
          echo "$RUNNER_TEMP/i32-clearance-env/bin" >> "$GITHUB_PATH"
      - name: Reproduce all current I32 evidence and package checks
        run: python docs/engineering/rvb22/analyses/i32/procurement_redline/ci_verify.py --out i32-clearance/evidence
      - name: Audit current source against the preserved handoff
        run: |
          python docs/engineering/rvb22/analyses/i32/source_audit.py \
            --native-dir docs/engineering/rvb22/analyses/i32/procurement_redline/native_final \
            --out i32-clearance/source --procurement-redline \
            --expected-source-sha 52ca35cf8cb4e2b4a27d053686ee3a85564f1e94dfdb7dcb4bca4083dd527312 \
            --expected-filled-sha 896ca56bf4ad836d63b84537cfd20bfcbf1783c60ac5d92ab7c7783d54f57e92
      - name: Verify retained I27 review invariants and physical boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          w=Path('docs/engineering/rvb22')
          current=json.loads((w/'FINAL_REVIEW_REGISTER.json').read_text())
          assert current['PCB_sha256']=='52ca35cf8cb4e2b4a27d053686ee3a85564f1e94dfdb7dcb4bca4083dd527312' and len(current['rows'])==11
          r=json.loads((w/current['historical_290_row_register']).read_text())
          a=json.loads((w/'analyses/i26/RECONCILIATION_AUDIT.json').read_text())
          b=json.loads((w/'analyses/i26/GND02_DESKTOP_CLOSURE.json').read_text())
          f=json.loads((w/'I27_FABRICATION_READINESS.json').read_text())
          assert len(r['rows']) == 290
          assert not [x for x in r['rows'] if x.get('desktop_status') == 'DESKTOP_WORK_REMAINING']
          assert a['actionable_prehardware_ids'] == []
          assert a['prehardware_counts'] == {'desktop_source_documentary':141,'conditional_model':31,'hardware_supplier_installation':114,'not_applicable':4,'desktop_work_remaining':0}
          assert b['gnd02_desktop_complete'] is True
          assert b['physical_tests_performed'] is False
          assert b['expanded_adjacent_plane_findings']['worst_bounce_V'] < 0.20
          assert b['expanded_adjacent_plane_findings']['CAN_RXD_worst_bounce_V'] < 0.05
          assert b['signal_via_transfers']['maximum_nearest_through_ground_via_mm'] <= b['signal_via_transfers']['lambda_over_20_screen_mm_at_0p5ns']
          assert f['actionable_prehardware_count'] == 0 and f['physical_tests_performed'] == 0
          print(json.dumps(f,indent=2))
          PY
          python docs/engineering/rvb22/i26_audit_open_rows.py
      - name: Retain current verification and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i32-clearance-${{ github.event.pull_request.head.sha }}
          path: i32-clearance/
          retention-days: 14
          if-no-files-found: error
