name: I28 main-rail supplier-model stage
on:
  push:
    branches: [codex/rvb28-electrical-signoff]
    paths:
      - .github/workflows/i28-main-supplier-stage.yml
      - docs/engineering/rvb22/analyses/i28/run_ti_main_ephemeral.py
permissions:
  contents: read
jobs:
  main-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice python3-numpy
      - name: Private supplier-model computation; derived outputs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/i28-main-results
          git rev-parse HEAD > /tmp/i28-main-results/COMMIT.txt
          ngspice --version > /tmp/i28-main-results/SOLVER.txt
          python3 - <<'PY'
          import urllib.request, pathlib, hashlib
          url='https://e2e.ti.com/cfs-file/__key/communityserver-discussions-components-files/196/LM63615_2D00_Q1_5F00_TRANS.lib'
          data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
          if hashlib.sha256(data).hexdigest()!='c03acbd9fa52e710410abffd664c9a1a538ee19f643a06c95ddfe10056fc951b':
              raise ValueError('Supplier attachment changed; review before executing.')
          p=pathlib.Path('/tmp/i28-private-supplier.lib');p.write_bytes(data);p.chmod(0o600)
          PY
          trap 'rm -f /tmp/i28-private-supplier.lib' EXIT
          python3 docs/engineering/rvb22/analyses/i28/run_ti_main_ephemeral.py --model /tmp/i28-private-supplier.lib --output /tmp/i28-main-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i28-main-derived-results
          path: /tmp/i28-main-results/
          retention-days: 14
