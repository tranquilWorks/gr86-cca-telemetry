name: Apply and validate stability firmware

on:
  push:
    branches:
      - fix/stability-first-ble-can
    paths:
      - ".stability-payload/**"
      - ".github/workflows/apply-stability-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stability-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository and pinned libraries
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Assemble exact firmware source and apply discovery fix
        shell: bash
        run: |
          set -euo pipefail
          cat .stability-payload/part00.txt \
              .stability-payload/part01.txt \
              .stability-payload/part02.txt \
              .stability-payload/part03.txt \
              > firmware/cca_telemetry.ino

          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/cca_telemetry.ino")
          source = path.read_text()

          old_uuid_block = '''static constexpr const char* RC_SERVICE_UUID =
              "00001ff8-0000-1000-8000-00805f9b34fb";
          static constexpr const char* RC_CHAR_CAN_UUID =
              "00000001-0000-1000-8000-00805f9b34fb";
          static constexpr const char* RC_CHAR_FILTER_UUID =
              "00000002-0000-1000-8000-00805f9b34fb";
          static constexpr const char* RC_CHAR_GPS_UUID =
              "00000003-0000-1000-8000-00805f9b34fb";
          static constexpr const char* RC_CHAR_GPS_TIME_UUID =
              "00000004-0000-1000-8000-00805f9b34fb";'''
          new_uuid_block = '''static constexpr uint16_t RC_SERVICE_UUID = 0x1FF8;
          static constexpr uint16_t RC_CHAR_CAN_UUID = 0x0001;
          static constexpr uint16_t RC_CHAR_FILTER_UUID = 0x0002;
          static constexpr uint16_t RC_CHAR_GPS_UUID = 0x0003;
          static constexpr uint16_t RC_CHAR_GPS_TIME_UUID = 0x0004;'''

          replacements = [
              (old_uuid_block, new_uuid_block),
              ('static constexpr const char* BUILD_ID = "2.0.0-stability-20260902";',
               'static constexpr const char* BUILD_ID = "2.0.1-racechrono-discovery-20260903";'),
              ('g_bleService = g_bleServer->createService(RC_SERVICE_UUID);',
               'g_bleService = g_bleServer->createService(NimBLEUUID(RC_SERVICE_UUID));'),
              ('RC_CHAR_CAN_UUID, NIMBLE_PROPERTY::READ | NIMBLE_PROPERTY::NOTIFY);',
               'NimBLEUUID(RC_CHAR_CAN_UUID),\n      NIMBLE_PROPERTY::READ | NIMBLE_PROPERTY::NOTIFY);'),
              ('RC_CHAR_FILTER_UUID, NIMBLE_PROPERTY::WRITE);',
               'NimBLEUUID(RC_CHAR_FILTER_UUID), NIMBLE_PROPERTY::WRITE);'),
              ('RC_CHAR_GPS_UUID, NIMBLE_PROPERTY::READ | NIMBLE_PROPERTY::NOTIFY);',
               'NimBLEUUID(RC_CHAR_GPS_UUID),\n      NIMBLE_PROPERTY::READ | NIMBLE_PROPERTY::NOTIFY);'),
              ('RC_CHAR_GPS_TIME_UUID,\n      NIMBLE_PROPERTY::READ | NIMBLE_PROPERTY::NOTIFY);',
               'NimBLEUUID(RC_CHAR_GPS_TIME_UUID),\n      NIMBLE_PROPERTY::READ | NIMBLE_PROPERTY::NOTIFY);'),
              ('g_bleAdvertising->addServiceUUID(RC_SERVICE_UUID);',
               'g_bleAdvertising->addServiceUUID(NimBLEUUID(RC_SERVICE_UUID));'),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one replacement target, got {count}: {old[:80]!r}"
                  )
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          sha256sum firmware/cca_telemetry.ino
          git diff --check

      - name: Enforce stability and RaceChrono discovery invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("firmware/cca_telemetry.ino").read_text()

          required = {
              'build identity': '2.0.1-racechrono-discovery-20260903',
              '16-bit RaceChrono service': 'static constexpr uint16_t RC_SERVICE_UUID = 0x1FF8;',
              '16-bit advertised service': 'addServiceUUID(NimBLEUUID(RC_SERVICE_UUID))',
              '16-bit CAN characteristic': 'NimBLEUUID(RC_CHAR_CAN_UUID)',
              '16-bit filter characteristic': 'NimBLEUUID(RC_CHAR_FILTER_UUID)',
              '16-bit GPS characteristic': 'NimBLEUUID(RC_CHAR_GPS_UUID)',
              '16-bit GPS-time characteristic': 'NimBLEUUID(RC_CHAR_GPS_TIME_UUID)',
              'event-driven reconnect': 'advertiseOnDisconnect(true)',
              'subscription gating': 'g_canSubscribed',
              'standard FIL parser': 'if (length != 7) return;',
              'accept-all hardware filter': 'TWAI_FILTER_CONFIG_ACCEPT_ALL()',
              'non-blocking CAN service': 'serviceCanStart(now);',
              'coalesced CAN cache': 'CAN_SLOT_COUNT = 96',
              'brownout breadcrumb': 'Boot reason:',
          }
          for label, needle in required.items():
              if needle not in source:
                  raise SystemExit(f"missing {label}: {needle}")

          forbidden = {
              'expanded RaceChrono service in discovery path': '00001ff8-0000-1000-8000-00805f9b34fb',
              'BLE passkey': 'setSecurityPasskey',
              'encrypted RaceChrono filter': 'WRITE_ENC',
              'forced connection parameters': 'ble_gap_update_params',
              'CAN silence restart': 'handleCanInactivityTimeout',
              'legacy reconnect reset': 'RC disconnected -> reset map',
              'per-frame BLE diagnostic stream': 'diagRecordFrame',
              'maximum BLE power': 'ESP_PWR_LVL_P9',
          }
          for label, needle in forbidden.items():
              if needle in source:
                  raise SystemExit(f"forbidden {label}: {needle}")

          if source.count('g_bleAdvertising->start()') != 1:
              raise SystemExit('advertising must have exactly one guarded start site')
          if 'while (!g_canRunning)' in source or 'while (!g_canDriverInstalled)' in source:
              raise SystemExit('blocking CAN bring-up loop detected')

          print('stability and RaceChrono discovery invariants passed')
          PY

      - name: Run host GPS parser smoke regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cca-tests
          cat > /tmp/cca-tests/test_nmea.cc <<'CPP'
          #include "gps_nmea.h"
          #include <cassert>
          #include <cmath>

          int main() {
            char rmc[] = "$GPRMC,123519,A,4807.038,N,01131.000,E,022.4,084.4,230394,003.1,W*6A";
            gps::RmcData rmcData;
            assert(gps::parseRmcSentence(rmc, rmcData));
            assert(rmcData.valid);
            assert(rmcData.has_time && rmcData.hour == 12 && rmcData.minute == 35);
            assert(rmcData.has_latitude && std::fabs(rmcData.latitude_deg - 48.1173) < 0.0001);
            assert(rmcData.has_longitude && std::fabs(rmcData.longitude_deg - 11.5166667) < 0.0001);

            char gga[] = "$GPGGA,123519,4807.038,N,01131.000,E,1,08,0.9,545.4,M,46.9,M,,*47";
            gps::GgaData ggaData;
            assert(gps::parseGgaSentence(gga, ggaData));
            assert(ggaData.has_sats && ggaData.sats == 8);
            assert(ggaData.has_hdop && std::fabs(ggaData.hdop - 0.9) < 0.001);
            assert(ggaData.has_altitude && std::fabs(ggaData.altitude_m - 545.4) < 0.001);
            return 0;
          }
          CPP
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
              -Ifirmware/src \
              /tmp/cca-tests/test_nmea.cc firmware/src/gps_nmea.cpp \
              -o /tmp/cca-tests/test_nmea
          /tmp/cca-tests/test_nmea

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.6

      - name: Compile exact ESP32-S3 sketch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cca_telemetry
          mkdir -p /tmp/cca_telemetry
          cp firmware/cca_telemetry.ino /tmp/cca_telemetry/cca_telemetry.ino
          cp firmware/config.h /tmp/cca_telemetry/config.h
          cp -R firmware/pidmaps /tmp/cca_telemetry/pidmaps
          cp -R firmware/src /tmp/cca_telemetry/src
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --warnings all \
            --libraries "$GITHUB_WORKSPACE/libraries" \
            /tmp/cca_telemetry

      - name: Commit validated firmware to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/cca_telemetry.ino
          if git diff --cached --quiet; then
            echo "Firmware already matches validated output."
            exit 0
          fi
          git commit -m "fix: advertise native 16-bit RaceChrono UUIDs"
          git push origin "HEAD:${GITHUB_REF_NAME}"